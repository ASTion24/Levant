[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "levant-engine"
version = "1.21.0"
description = "Levant Engine backend and local web UI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.123.0",
  "uvicorn==0.38.0",
  "pydantic==2.12.5",
  "requests==2.32.5",
  "urllib3<2",
  "pypdf==6.16.1",
  "python-docx==1.2.0",
]

[project.optional-dependencies]
build = [
  "pyinstaller==6.17.0",
]
test = [
  "httpx==0.28.1",
]
